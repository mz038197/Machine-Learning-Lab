[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "add-linear-regression"
version = "0.1.0"
description = "把線性回歸實驗夾寫進學生專案，並裝上相依。"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
add-linear-regression = "add_linear_regression.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/add_linear_regression"]

[tool.hatch.build.targets.wheel.sources]
"src/add_linear_regression" = "add_linear_regression"

[tool.hatch.build.targets.wheel.force-include]
"線性回歸_濃縮草案.ipynb" = "add_linear_regression/experiment/線性回歸_濃縮草案.ipynb"
"data/ex1data1.txt" = "add_linear_regression/experiment/data/ex1data1.txt"
"data/ex1data2.txt" = "add_linear_regression/experiment/data/ex1data2.txt"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
