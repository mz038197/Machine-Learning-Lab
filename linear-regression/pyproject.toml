[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "add-linear-regression"
version = "0.1.0"
description = "把線性回歸實驗夾寫進學生專案，並裝上相依。"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
add-linear-regression = "add_linear_regression.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
add_linear_regression = ["experiment/*", "experiment/data/*"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
