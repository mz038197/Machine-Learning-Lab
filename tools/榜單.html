<!doctype html>
<html lang="zh-Hant" data-theme="白天">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>榜單</title>
<meta name="description" content="老師投影用的榜單，把各組畫成在山上爬的小人">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Noto+Sans+TC:wght@500;800&display=swap" rel="stylesheet">
<script>{ const 風格 = new URLSearchParams(location.search).get("風格"); if (["白天", "夜晚", "日出"].includes(風格)) document.documentElement.dataset.theme = 風格; }</script>
<!--
  老師投影用的榜單。讀一張成績表（Google 試算表），把各組畫成在山上爬的小人。
  直接用瀏覽器打開這個檔案就能用，按右上角的齒輪貼上成績表的連結，也可以選風格（白天、夜晚、日出）。
  山和小人用 three.js 畫成立體的（要上網載入）；電腦跑不了 WebGL 時會自動改畫平面的山。
  成績表：第一欄組別，最後一欄成績，中間都是組員。要開「知道連結的人可以檢視」。
  邏輯的測試：node --test "tools/tests/*.test.mjs"
-->
<style>
/* Hallmark · v2.0.0 · redesign: restyle · scope: app · theme: piste (dealt 1/3, seed classroom-projector-leaderboard-where-f831·a0bc8ff8·2026-11-03·r0) · styles: 白天 snow, 夜晚 night-piste, 日出 sunrise (blue-run dropped after the prototype) · scene and climbers in three.js, names stay SVG */
/* critique: the mountain and the climbers are the screen; the panel must read from the back row, so rank and score are set in the condensed face, large */
:root {
  --font-display: "Barlow Condensed", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --rule-hair: 1px; --rule-bar: 3px;
  --dur-micro: 120ms; --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --color-focus: oklch(58% 0.22 28);
  --color-ok: oklch(62% 0.16 150);
  --color-bad: oklch(56% 0.21 28);
  --scrim: oklch(16% 0.012 260 / 0.55);
  --shadow-dialog: 0 20px 60px oklch(16% 0.012 260 / 0.3);
  --skin: oklch(87% 0.05 60); --legs: oklch(28% 0.015 250); --pack: oklch(42% 0.07 55);
  --pole: oklch(34% 0.04 60); --rope: oklch(72% 0.08 75);
  --crown: oklch(84% 0.16 88); --crown-edge: oklch(48% 0.1 70);
}
/* 白天：白紙黑字，鈷藍只給名次 */
:root, :root[data-theme="白天"] {
  --paper: oklch(98.5% 0.005 260); --paper-2: oklch(95% 0.008 260);
  --ink: oklch(16% 0.012 260); --muted: oklch(40% 0.016 260); --rule: oklch(84% 0.01 260);
  --accent: oklch(50% 0.25 265); --accent-deep: oklch(40% 0.2 266); --accent-ink: oklch(98.5% 0.004 260);
  --alert: oklch(52% 0.21 28);
  --panel: var(--paper); --panel-ink: var(--ink); --panel-muted: var(--muted); --panel-rule: var(--rule);
  --panel-bar: var(--ink); --rank-ink: var(--accent); --score-ink: var(--ink); --panel-alert: var(--alert);
  --sky: oklch(88% 0.05 235); --sun: oklch(96% 0.05 95); --glow: oklch(98% 0.04 95); --cloud: var(--paper);
  --mount-top: oklch(56% 0.05 250); --mount-bottom: oklch(36% 0.05 250);
  --far-top: oklch(80% 0.03 240); --far-bottom: oklch(71% 0.03 240);
  --snowcap: var(--paper); --summit-flag: var(--alert); --trail: var(--paper);
  --ground: var(--paper-2); --ground-edge: var(--ink);
  --tent: var(--accent); --tent-door: var(--ink); --camp-ink: var(--ink);
  --name-ink: var(--ink); --name-halo: var(--paper);
}
/* 夜晚：深色底，成績最大，沒成績的縮成一排小標籤 */
:root[data-theme="夜晚"] {
  --paper: oklch(14% 0.01 260); --paper-2: oklch(19% 0.014 260);
  --ink: oklch(97% 0.005 260); --muted: oklch(76% 0.015 260); --rule: oklch(32% 0.015 260);
  --accent: oklch(68% 0.18 265); --accent-deep: oklch(76% 0.14 265); --accent-ink: oklch(14% 0.01 260);
  --alert: oklch(70% 0.18 28);
  --panel: var(--paper); --panel-ink: var(--ink); --panel-muted: var(--muted); --panel-rule: var(--rule);
  --panel-bar: var(--ink); --rank-ink: var(--muted); --score-ink: var(--accent); --panel-alert: var(--alert);
  --sky: oklch(21% 0.035 262); --sun: oklch(93% 0.02 95); --glow: oklch(90% 0.03 240); --cloud: oklch(36% 0.025 260);
  --mount-top: oklch(46% 0.04 258); --mount-bottom: oklch(28% 0.03 258);
  --far-top: oklch(32% 0.03 260); --far-bottom: oklch(26% 0.025 260);
  --snowcap: oklch(94% 0.01 260); --trail: oklch(92% 0.01 260);
  --ground: oklch(24% 0.015 260); --ground-edge: var(--ink);
  --tent: var(--accent); --tent-door: var(--paper); --camp-ink: var(--ink);
  --name-ink: var(--ink); --name-halo: var(--paper);
}
/* 日出：面板和 A 一樣，山被早上的太陽照成暖色 */
:root[data-theme="日出"] { --sky: oklch(90% 0.05 75); }

/* 立體版（three.js）的顏色：每個風格一組 */
:root, :root[data-theme="白天"] {
  --d-sky: linear-gradient(oklch(74% 0.09 245), oklch(92% 0.035 230));
  --d-snow: oklch(97% 0.008 250); --d-snow-shade: oklch(87% 0.03 250);
  --d-rock: oklch(56% 0.04 250); --d-rock-dark: oklch(43% 0.045 252);
  --d-ground: oklch(95% 0.012 240); --d-far: oklch(80% 0.035 245); --d-far-cap: oklch(96% 0.01 245);
  --d-pine: oklch(42% 0.07 165); --d-trunk: oklch(38% 0.05 55); --d-stone: oklch(62% 0.02 250);
  --d-tent: var(--accent); --d-tent-door: var(--ink); --d-sign: oklch(50% 0.07 60);
  --d-cloud: oklch(99% 0.005 260); --d-flake: oklch(99% 0.005 260); --d-star: oklch(98% 0.02 90);
  --d-sun: oklch(96% 0.07 95); --d-sunlight: oklch(99% 0.02 90);
  --d-hemi-sky: oklch(90% 0.04 240); --d-hemi-ground: oklch(68% 0.03 250); --d-fire: oklch(76% 0.17 58);
  --d-trail: var(--accent);
}
:root[data-theme="夜晚"] {
  --d-sky: linear-gradient(oklch(13% 0.03 265), oklch(27% 0.045 262));
  --d-snow: oklch(82% 0.03 255); --d-snow-shade: oklch(66% 0.04 258);
  --d-rock: oklch(36% 0.03 258); --d-rock-dark: oklch(27% 0.03 260);
  --d-ground: oklch(64% 0.03 255); --d-far: oklch(30% 0.03 260); --d-far-cap: oklch(58% 0.03 258);
  --d-pine: oklch(28% 0.04 200); --d-trunk: oklch(26% 0.03 55); --d-stone: oklch(42% 0.02 258);
  --d-tent: var(--accent); --d-tent-door: oklch(82% 0.14 78); --d-sign: oklch(40% 0.05 60);
  --d-cloud: oklch(36% 0.025 260); --d-flake: oklch(94% 0.01 260);
  --d-sun: oklch(95% 0.02 95); --d-sunlight: oklch(86% 0.04 250);
  --d-hemi-sky: oklch(50% 0.06 262); --d-hemi-ground: oklch(20% 0.02 260);
  --d-trail: var(--accent);
}
:root[data-theme="日出"] {
  --d-sky: linear-gradient(oklch(78% 0.08 55), oklch(93% 0.05 85));
  --d-snow: oklch(96% 0.025 70); --d-snow-shade: oklch(85% 0.055 50);
  --d-rock: oklch(53% 0.05 40); --d-rock-dark: oklch(41% 0.05 35);
  --d-ground: oklch(94% 0.025 70); --d-far: oklch(77% 0.06 50); --d-far-cap: oklch(94% 0.03 70);
  --d-pine: oklch(40% 0.06 150); --d-stone: oklch(60% 0.03 50);
  --d-sun: oklch(89% 0.13 78); --d-sunlight: oklch(90% 0.08 65);
  --d-hemi-sky: oklch(88% 0.05 70); --d-hemi-ground: oklch(58% 0.05 40);
  --d-cloud: oklch(96% 0.03 70);
}
:root {
  --d-boot: oklch(32% 0.04 50); --d-glove: oklch(24% 0.01 260); --d-eye: oklch(18% 0.01 260);
  --d-cheek: oklch(76% 0.1 20); --d-scarf: oklch(97% 0.005 260); --d-metal: oklch(72% 0.01 260);
  --d-flag-ink: oklch(99% 0.005 260); --d-shadow: oklch(10% 0.005 260);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow-x: clip; overflow-y: clip; }
body { background: var(--panel); color: var(--ink); font-family: var(--font-body); }
.版面 { display: grid; grid-template-columns: minmax(0, 1fr) clamp(380px, 33vw, 640px); height: 100vh; }
/* 標題在上面佔自己的一塊，山畫在剩下的空間，兩個不會疊在一起 */
.山區 { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--sky); }
.山區 svg { flex: 1; min-height: 0; width: 100%; display: block; }
.山區 { position: relative; }
.山區 svg, .抬頭 { position: relative; z-index: 1; }
.立體畫布 { display: none; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
:root.有3D .立體畫布 { display: block; }
/* 3D 開起來之後，SVG 只留名字、問號和「超車」；步道用 visibility 藏，程式還要量它的長度 */
:root.有3D .山區 { background: var(--d-sky); }
:root.有3D #山 > :not(#隊伍):not(#步道):not(defs) { display: none; }
:root.有3D #步道 { visibility: hidden; }
:root.有3D #隊伍 .人, :root.有3D .人們 > path, :root.有3D .身 > g:not(.人們) { display: none; }
.抬頭 { padding: var(--space-4) var(--space-6) 0; pointer-events: none; }
.抬頭 h1 { margin: 0; font: 800 clamp(32px, 3vw, 56px)/1.05 var(--font-display); color: var(--ink); text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
.抬頭 p { margin: var(--space-1) 0 0; font-size: clamp(18px, 1.3vw, 24px); font-weight: 500; color: var(--muted); }

.面板 { background: var(--panel); color: var(--panel-ink); border-left: var(--rule-bar) solid var(--panel-bar); display: flex; flex-direction: column; padding: var(--space-5) var(--space-5) var(--space-4); min-height: 0; }
.面板頭 { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); border-bottom: var(--rule-bar) solid var(--panel-ink); padding-bottom: var(--space-2); }
.面板頭 h2 { margin: 0; font: 800 clamp(30px, 2.4vw, 44px)/1 var(--font-display); }
.齒輪 { width: 56px; height: 56px; display: grid; place-items: center; border: 0; border-radius: 0; background: transparent; color: var(--panel-ink); cursor: pointer; transition: background-color var(--dur-micro) var(--ease-out); }
.齒輪 svg { width: 32px; height: 32px; }
.齒輪:hover { background: color-mix(in oklab, var(--panel-ink) 12%, transparent); }
.齒輪:active { background: color-mix(in oklab, var(--panel-ink) 24%, transparent); }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }

.名次表 { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.名次表 li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-1); border-bottom: var(--rule-hair) solid var(--panel-rule); font-size: clamp(22px, 1.7vw, 32px); line-height: 1.2; }
.名次表 .名次 { font: 800 1.5em/1 var(--font-display); color: var(--rank-ink); text-align: center; font-variant-numeric: tabular-nums; }
.名次表 .誰 { min-width: 0; }
.名次表 .組號 { font-weight: 800; display: inline-flex; align-items: center; gap: var(--space-2); }
.名次表 .點 { width: 0.7em; height: 0.7em; display: inline-block; }
.名次表 .組員 { color: var(--panel-muted); font-size: 0.72em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.名次表 .成績 { font: 800 1.35em/1 var(--font-display); font-variant-numeric: tabular-nums; text-align: right; color: var(--score-ink); }
.名次表 li.沒名次 { opacity: 0.6; }
.名次表 li.讀不懂 .成績 { color: var(--panel-alert); font: 700 0.8em/1.2 var(--font-body); max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.狀態列 { display: flex; align-items: center; gap: var(--space-2); color: var(--panel-muted); font-size: 18px; padding-top: var(--space-3); }
.燈 { width: 12px; height: 12px; background: var(--color-ok); flex: none; }
.燈.壞 { background: var(--color-bad); }
.提示 { color: var(--panel-alert); font-size: 18px; }

/* 夜晚：成績在上、組在下；沒成績的變成一排小標籤 */
:root[data-theme="夜晚"] .名次表 { display: flex; flex-wrap: wrap; align-content: flex-start; gap: var(--space-2); }
:root[data-theme="夜晚"] .名次表 li { flex: 1 0 100%; grid-template-columns: 1.4em minmax(0, 1fr); grid-template-areas: "名 分" "名 誰"; row-gap: 0; padding-block: var(--space-2); }
:root[data-theme="夜晚"] .名次表 .名次 { grid-area: 名; align-self: start; font-size: 1.3em; }
:root[data-theme="夜晚"] .名次表 .成績 { grid-area: 分; text-align: left; font-size: 1.7em; }
:root[data-theme="夜晚"] .名次表 .誰 { grid-area: 誰; display: flex; gap: var(--space-3); align-items: baseline; min-width: 0; }
:root[data-theme="夜晚"] .名次表 li.沒名次 { flex: 0 0 auto; display: inline-flex; gap: var(--space-2); font-size: 20px; padding: var(--space-1) var(--space-3); border: var(--rule-hair) solid var(--panel-rule); opacity: 0.8; }
:root[data-theme="夜晚"] .名次表 li.沒名次 .名次, :root[data-theme="夜晚"] .名次表 li.沒名次 .組員 { display: none; }
:root[data-theme="夜晚"] .名次表 li.沒名次 .成績 { font: 500 1em/1.2 var(--font-body); color: var(--panel-muted); }

/* 設定 */
dialog { border: var(--rule-bar) solid var(--ink); border-radius: 0; padding: var(--space-6); width: min(640px, calc(100% - 32px)); box-shadow: var(--shadow-dialog); color: var(--ink); background: var(--paper); font-size: 20px; }
dialog::backdrop { background: var(--scrim); }
dialog h2 { margin: 0 0 var(--space-3); font: 800 36px/1 var(--font-display); }
dialog label { display: block; font-weight: 800; margin: var(--space-4) 0 var(--space-2); }
dialog input, dialog select { width: 100%; min-height: 52px; font: inherit; padding: var(--space-2) var(--space-3); border-radius: 0; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); transition: border-color var(--dur-micro) var(--ease-out); }
dialog input:hover, dialog select:hover { border-color: var(--accent); }
dialog input:disabled, dialog select:disabled { opacity: 0.5; cursor: not-allowed; }
dialog .說明 { color: var(--muted); font-size: 17px; margin: var(--space-2) 0 0; line-height: 1.6; }
dialog .錯誤 { color: var(--alert); min-height: 1.4em; margin: var(--space-3) 0 0; }
dialog .按鈕列 { display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-3); }
dialog button { min-height: 52px; padding: 0 var(--space-5); border: 0; border-radius: 0; font: 800 22px/1 var(--font-display); cursor: pointer; background: none; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
dialog button:hover { background: var(--paper-2); }
dialog button:active { background: var(--ink); color: var(--paper); }
dialog button.主要 { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
dialog button.主要:hover { background: var(--accent-deep); }
dialog button.主要:active { background: var(--ink); color: var(--paper); }
dialog button:disabled { opacity: 0.5; cursor: not-allowed; }

/* 山的顏色 */
.山色上 { stop-color: var(--mount-top); } .山色下 { stop-color: var(--mount-bottom); }
.遠山上 { stop-color: var(--far-top); } .遠山下 { stop-color: var(--far-bottom); }
.光暈心 { stop-color: var(--glow); stop-opacity: 1; } .光暈邊 { stop-color: var(--glow); stop-opacity: 0; }
.太陽 { fill: var(--sun); } .雲 ellipse { fill: var(--cloud); }
.雪頂 { fill: var(--snowcap); } .頂旗桿 { stroke: var(--pole); } .頂旗 { fill: var(--summit-flag); }
#步道 { stroke: var(--trail); }
.地面 { fill: var(--ground); } .地面邊 { fill: var(--ground-edge); }
.帳篷 { fill: var(--tent); } .帳篷門 { fill: var(--tent-door); } .帳篷桿 { stroke: var(--tent-door); }
.營地字 { fill: var(--camp-ink); font-family: var(--font-body); font-size: 24px; font-weight: 800; }
#隊伍 text { font-family: var(--font-body); }
.人們 > g > text { fill: var(--name-ink); stroke: var(--name-halo); font-size: 15px; }
.臉 > rect:first-child { fill: var(--pack); } .臉 > line { stroke: var(--legs); } .臉 > circle { fill: var(--skin); }
.人們 > path { stroke: var(--rope); }
.身 > g:not(.人們) > line { stroke: var(--pole); }
.皇冠形 { fill: var(--crown); stroke: var(--crown-edge); stroke-width: 2; stroke-linejoin: round; }
.問號 { fill: var(--alert); } .超車 { fill: var(--alert); stroke: var(--name-halo); }

/* 山上的小人 */
.隊 .身 { transition: transform 0.3s; }
.隊.走 .人 { animation: 走路 0.36s ease-in-out infinite alternate; }
.隊.走 .人:nth-child(2n) { animation-delay: 0.18s; }
@keyframes 走路 { from { transform: translateY(0); } to { transform: translateY(-4px); } }
.隊.跳 .身 { animation: 跳 0.5s ease-out 3; }
@keyframes 跳 { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-22px); } }
.超車 { opacity: 0; transition: opacity 0.3s; }
.隊.跳 .超車 { opacity: 1; }
.隊.朝左 .臉 { transform: scaleX(-1); }
.皇冠 { display: none; }
.隊.第一 .皇冠 { display: inline; }
.問號 { display: none; }
.隊.讀不懂 .問號 { display: inline; animation: 晃 1.2s ease-in-out infinite; }
@keyframes 晃 { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
.山頂光 { animation: 光 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes 光 { 0%, 100% { opacity: 0.35; transform: scale(0.9); } 50% { opacity: 0.8; transform: scale(1.1); } }
.雲 { animation: 飄 60s linear infinite; }
.雲.慢 { animation-duration: 90s; }
@keyframes 飄 { from { transform: translateX(-300px); } to { transform: translateX(1500px); } }

@media (prefers-reduced-motion: reduce) {
  .雲, .山頂光, .隊.走 .人, .隊.跳 .身, .隊.讀不懂 .問號 { animation: none; }
  .隊 .身, .超車, .齒輪, dialog button, dialog input, dialog select { transition: none; }
}
</style>
</head>
<body>
<div class="版面">
  <main class="山區">
    <div class="抬頭">
      <h1 id="名稱">榜單</h1>
      <p id="副標">按右上角的齒輪，貼上成績表的連結</p>
    </div>
    <svg id="山" viewBox="0 0 1200 860" preserveAspectRatio="xMidYMax meet" aria-label="各組在山上的位置">
      <defs>
        <linearGradient id="山色" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="山色上"/>
          <stop offset="1" class="山色下"/>
        </linearGradient>
        <linearGradient id="遠山色" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="遠山上"/>
          <stop offset="1" class="遠山下"/>
        </linearGradient>
        <radialGradient id="光暈">
          <stop offset="0" class="光暈心"/>
          <stop offset="1" class="光暈邊"/>
        </radialGradient>
      </defs>

<script id="榜單邏輯">
function 解析連結(連結) {
  const 找到 = 連結.match(/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/);
  if (!找到) throw new Error("這不是 Google 試算表的連結。請到試算表按「共用」→「複製連結」再貼上。");
  const gid = 連結.match(/[?#&]gid=(\d+)/);
  return { id: 找到[1], gid: gid ? gid[1] : null };
}

function 讀資料網址(連結, 回呼名稱) {
  const { id, gid } = 解析連結(連結);
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json;responseHandler:${回呼名稱}&headers=1`
    + (gid ? `&gid=${gid}` : "");
}

function 格子文字(格) {
  if (!格 || 格.v === null || 格.v === undefined) return "";
  return String(格.f ?? 格.v).trim();
}

// 從學生填的文字裡抓出第一個數字：全形轉半形、拿掉千分位逗號、百分比換成小數
function 讀成績(文字) {
  const 整理 = 文字.normalize("NFKC").replace(/(\d),(?=\d)/g, "$1");
  const 找到 = 整理.match(/([-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?)\s*(%?)/i);
  if (!找到) return null;
  const 數 = Number(找到[1]);
  if (!Number.isFinite(數)) return null;
  return 找到[2] ? 數 / 100 : 數;
}

function 看欄名猜方向(欄名) {
  if (/loss|mse|rmse|mae|error|誤差|損失/i.test(欄名)) return "越小越好";
  if (/正確率|準確率|accuracy|acc\b|f1|r2|r²/i.test(欄名)) return "越大越好";
  return null;
}

function 排出榜單(表格, 方向) {
  // 第一欄是組別，最後一欄是成績，中間都是組員
  const 欄數 = 表格.cols.length;
  if (欄數 === 0) return { 標題: "", 方向: 方向 || "越小越好", 方向是預設的: !方向, 組: [] };
  const 標題 = (表格.cols[欄數 - 1].label || "").trim();
  const 組 = 表格.rows
    .map((列) => Array.from({ length: 欄數 }, (_, i) => 格子文字((列.c || [])[i])))
    .filter((文字) => 文字[0] !== "")
    .map((文字) => {
      const 成績原文 = 文字[欄數 - 1];
      const 成績 = 讀成績(成績原文);
      const 狀態 = 成績原文 === "" ? "未填" : 成績 === null ? "讀不懂" : "已填";
      const 組員 = 文字.slice(1, 欄數 - 1).filter((名) => 名 !== "");
      return { 組別: 文字[0], 組員, 成績原文, 成績, 狀態, 名次: null, 高度: null };
    });
  const 猜的 = 看欄名猜方向(標題);
  const 方向是預設的 = !方向 && !猜的;
  方向 = 方向 || 猜的 || "越小越好";
  const 有成績 = 組.filter((g) => g.狀態 === "已填");
  // 換成「越大越好」的分數再排，兩個方向共用同一套算法
  const 分數 = (g) => (方向 === "越大越好" ? g.成績 : -g.成績);
  const 全部 = 有成績.map(分數);
  const 最好 = Math.max(...全部), 最差 = Math.min(...全部);
  for (const g of 有成績) {
    g.名次 = 1 + 有成績.filter((o) => 分數(o) > 分數(g)).length;
    g.高度 = 最好 === 最差 ? 1 : (分數(g) - 最差) / (最好 - 最差);
  }
  // 沒名次的照試算表的順序排在最後
  組.sort((a, b) => (a.名次 ?? Infinity) - (b.名次 ?? Infinity));
  return { 標題, 方向, 方向是預設的, 組 };
}
</script>

<script>
const 刷新秒數 = 10;
const 走路毫秒 = 1500;
const 靠近比例 = 0.12; // 每格畫面往目標靠近多少
const 隊距 = 16; // 並排的組之間留多寬
const 名字第二行y = 36; // 名字錯開兩行，第二行在腳下多低
const 一排高 = 128; // 小人從旗子頂到第二行名字底大約多高
const 最小縮放 = 0.6;
const 可站比例 = 0.9; // 小人只站在山寬的九成以內，不要站到山的邊緣外面
const 最低排y = 730; // 一排一排往下排，最低排到步道起點的高度
const 山中心x = 600;
const 營地左 = 260, 營地可用寬 = 1150 - 營地左; // 從步道起點右邊開始排，不要和最後一名疊在一起
const 色票 = ["#e0453a", "#2f7fd8", "#f2a51a", "#2f9e5b", "#8b4fd1", "#e2669f", "#16a3a3", "#7a5230", "#5b6b7a", "#a3c428", "#d9622b", "#3b4bc8"];
const SVG = "http://www.w3.org/2000/svg";
const 風格們 = ["白天", "夜晚", "日出"];
const $ = (id) => document.getElementById(id);
const 步道 = $("步道");
const 步道長 = 步道.getTotalLength();

// ---------- 設定（存在網址裡） ----------
function 讀設定() {
  const q = new URLSearchParams(location.search);
  const id = q.get("sheet");
  return {
    連結: id ? `https://docs.google.com/spreadsheets/d/${id}/edit` + (q.get("gid") ? `#gid=${q.get("gid")}` : "") : "",
    方向: ["越小越好", "越大越好"].includes(q.get("方向")) ? q.get("方向") : "",
    名稱: q.get("名稱") || "",
    風格: 風格們.includes(q.get("風格")) ? q.get("風格") : "白天",
  };
}

function 寫設定({ 連結, 方向, 名稱, 風格 }) {
  const { id, gid } = 解析連結(連結);
  const q = new URLSearchParams();
  q.set("sheet", id);
  if (gid) q.set("gid", gid);
  if (方向) q.set("方向", 方向);
  if (名稱) q.set("名稱", 名稱);
  if (風格 !== "白天") q.set("風格", 風格);
  history.replaceState(null, "", "?" + q.toString());
}

let 設定 = 讀設定();

function 開設定() {
  $("連結").value = 設定.連結;
  $("方向選擇").value = 設定.方向;
  $("名稱輸入").value = 設定.名稱;
  $("風格選擇").value = 設定.風格;
  $("設定錯誤").textContent = "";
  $("設定").showModal();
}

$("開設定").addEventListener("click", 開設定);
$("取消").addEventListener("click", () => $("設定").close());
$("設定表單").addEventListener("submit", (e) => {
  const 新 = { 連結: $("連結").value.trim(), 方向: $("方向選擇").value, 名稱: $("名稱輸入").value.trim(), 風格: $("風格選擇").value };
  try {
    解析連結(新.連結);
  } catch (錯) {
    e.preventDefault();
    $("設定錯誤").textContent = 錯.message;
    return;
  }
  寫設定(新);
  設定 = 讀設定();
  換風格();
  寫名稱();
  for (const 隊 of 隊伍.values()) 隊.根.remove();
  隊伍.clear();
  組色.clear();
  上次名次.clear();
  第一次 = true;
  讀一次();
});

// ---------- 讀成績表（JSONP，直接打開檔案也能讀） ----------
let 序號 = 0;
function 抓表格(連結) {
  return new Promise((成功, 失敗) => {
    const 名 = `__bangdan_cb${++序號}`; // Google 只接受英數字的回呼名稱，中文會被換成預設名稱
    const 腳本 = document.createElement("script");
    const 收尾 = () => { delete window[名]; 腳本.remove(); clearTimeout(計時); };
    const 計時 = setTimeout(() => { 收尾(); 失敗(new Error("讀太久沒有回應")); }, 8000);
    window[名] = (回應) => {
      收尾();
      if (回應.status === "ok") 成功(回應.table);
      else 失敗(new Error((回應.errors || []).map((e) => e.detailed_message || e.message).join("；") || "試算表回傳錯誤"));
    };
    腳本.onerror = () => { 收尾(); 失敗(new Error("讀不到試算表，請確認已開「知道連結的人可以檢視」")); };
    腳本.src = 讀資料網址(連結, 名) + `&_=${Date.now()}`;
    document.head.appendChild(腳本);
  });
}

let 讀取代號 = 0;
async function 讀一次() {
  if (!設定.連結) return;
  const 這次 = ++讀取代號;
  try {
    const 表格 = await 抓表格(設定.連結);
    if (這次 !== 讀取代號) return; // 換了成績表，舊的回應不要了
    畫(排出榜單(表格, 設定.方向 || undefined));
    $("燈").classList.remove("壞");
    $("更新時間").textContent = "最後更新 " + new Date().toLocaleTimeString("zh-TW", { hour12: false });
    $("提示").textContent = "";
  } catch (錯) {
    if (這次 !== 讀取代號) return;
    $("燈").classList.add("壞");
    $("提示").textContent = 錯.message;
  }
}

// ---------- 畫畫面 ----------
const 組色 = new Map();
function 顏色(組別) {
  if (!組色.has(組別)) 組色.set(組別, 色票[組色.size % 色票.length]);
  return 組色.get(組別);
}

function 元素(標籤, 屬性 = {}, 父) {
  const e = document.createElementNS(SVG, 標籤);
  for (const [k, v] of Object.entries(屬性)) e.setAttribute(k, v);
  if (父) 父.appendChild(e);
  return e;
}

function 造一個人(父, x, 色, 名字, 第幾個) {
  // 外層管位置和名字，內層 .人 會上下晃（走路）
  // 人和人只隔 40，三個字的名字放不下，所以名字一上一下錯開兩行
  const 位 = 元素("g", { transform: `translate(${x} 0)` }, 父);
  const 名 = 元素("text", { y: 第幾個 % 2 ? 名字第二行y : 16,"text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: "#1d2b36", stroke: "#fff", "stroke-width": 3.5, "paint-order": "stroke" }, 位);
  名.textContent = 名字;
  const 人 = 元素("g", { class: "人" }, 位);
  const 內 = 元素("g", { class: "臉" }, 人); // 朝左時整個人左右翻
  元素("rect", { x: -11, y: -40, width: 9, height: 18, rx: 3, fill: "#6b4a2b" }, 內); // 背包
  元素("line", { x1: -4, y1: -8, x2: -6, y2: 0, stroke: "#2b3540", "stroke-width": 4, "stroke-linecap": "round" }, 內);
  元素("line", { x1: 4, y1: -8, x2: 6, y2: 0, stroke: "#2b3540", "stroke-width": 4, "stroke-linecap": "round" }, 內);
  元素("rect", { x: -8, y: -32, width: 16, height: 25, rx: 6, fill: 色 }, 內);
  元素("circle", { cx: 0, cy: -40, r: 8, fill: "#f6d2b0" }, 內);
  元素("path", { d: "M -8 -42 Q 0 -54 8 -42 Z", fill: 色 }, 內); // 帽子
  return 人;
}

const 隊伍 = new Map(); // 組別 → 這組在山上的圖和走路狀態（見 造隊伍）
const 上次名次 = new Map();
let 第一次 = true;

function 造隊伍(g) {
  const 色 = 顏色(g.組別);
  const 根 = 元素("g", { class: "隊" }, $("隊伍"));
  const 身 = 元素("g", { class: "身" }, 根);
  const 人們 = 元素("g", { class: "人們" }, 身);
  const 旗 = 元素("g", {}, 身);
  元素("line", { x1: 0, y1: -40, x2: 0, y2: -84, stroke: "#4a3a2a", "stroke-width": 3 }, 旗);
  元素("rect", { x: 0, y: -84, width: 34, height: 22, rx: 3, fill: 色 }, 旗);
  const 組號 = 元素("text", { x: 17, y: -67, "text-anchor": "middle", "font-size": 16, "font-weight": 800, fill: "#fff" }, 旗);
  組號.textContent = g.組別;
  const 皇冠 = 元素("g", { class: "皇冠" }, 旗);
  元素("polygon", { class: "皇冠形", points: "3,-88 3,-104 10,-96 17,-108 24,-96 31,-104 31,-88" }, 皇冠);
  const 問號 = 元素("text", { class: "問號", x: 0, y: -96, "text-anchor": "middle", "font-size": 34, "font-weight": 900, fill: "#e0453a" }, 身);
  問號.textContent = "?";
  const 超車 = 元素("text", { class: "超車", x: 0, y: -100, "text-anchor": "middle", "font-size": 22, "font-weight": 900, fill: "#e0453a", stroke: "#fff", "stroke-width": 5, "paint-order": "stroke" }, 身);
  超車.textContent = "↑ 超車！";
  const 隊 = {
    根, 身, 人們, 旗, 色, 名單: null, 人數: 1,
    // 沿步道走：現在s 從 起s 走到 目標s
    現在s: 0, 起s: 0, 目標s: 0, 起時: 0,
    在營地: true, 營地點: { x: 0, y: 0 },
    偏移: 0, 偏移y: 0, 縮放: 1, // 排開擠在一起的組時，往旁邊、往下挪多少、縮多小
    顯示: null, 面向: 1, // 畫面上實際的位置，每格往目標靠近一點
  };
  隊伍.set(g.組別, 隊);
  return 隊;
}

function 換組員(隊, 組員) {
  const 名單 = 組員.join("、");
  if (隊.名單 !== 名單) {
    隊.名單 = 名單;
    const 人數 = Math.max(1, 組員.length);
    隊.人數 = 人數;
    隊.人們.replaceChildren();
    const 間距 = 40, 起 = -((人數 - 1) * 間距) / 2;
    if (人數 > 1) {
      // 繩子
      const 點 = Array.from({ length: 人數 }, (_, i) => 起 + i * 間距);
      const d = 點.slice(1).map((x, i) => `Q ${(點[i] + x) / 2} -10 ${x} -20`).join(" ");
      元素("path", { d: `M ${點[0]} -20 ${d}`, fill: "none", stroke: "#c9a46a", "stroke-width": 2.5 }, 隊.人們);
    }
    for (let i = 0; i < 人數; i++) 造一個人(隊.人們, 起 + i * 間距, 隊.色, 組員[i] || "", i);
    隊.旗.setAttribute("transform", `translate(${起 - 6} 0)`);
  }
}

function 寫名稱() {
  $("名稱").textContent = 設定.名稱 || "榜單";
  document.title = 設定.名稱 ? `${設定.名稱}｜榜單` : "榜單";
}

function 畫(榜) {
  寫名稱();
  $("副標").textContent = `${榜.標題 || "成績"}（${榜.方向}${榜.方向是預設的 ? "，看不出方向，請按齒輪指定" : ""}）`;
  $("面板標題").textContent = 榜.標題 || "名次";

  // 名次表
  const 列表 = $("名次表");
  列表.replaceChildren();
  for (const g of 榜.組) {
    const li = document.createElement("li");
    if (g.名次 === null) li.classList.add("沒名次");
    if (g.狀態 === "讀不懂") li.classList.add("讀不懂");
    const 名次 = document.createElement("span");
    名次.className = "名次";
    名次.textContent = g.名次 ?? "–";
    const 誰 = document.createElement("div");
    誰.className = "誰";
    const 組號 = document.createElement("div");
    組號.className = "組號";
    const 點 = document.createElement("span");
    點.className = "點";
    點.style.background = 顏色(g.組別);
    組號.append(點, `第 ${g.組別} 組`);
    const 組員 = document.createElement("div");
    組員.className = "組員";
    組員.textContent = g.組員.join("、") || "　";
    誰.append(組號, 組員);
    const 成績 = document.createElement("span");
    成績.className = "成績";
    成績.textContent = g.狀態 === "未填" ? "未填" : g.狀態 === "讀不懂" ? `? ${g.成績原文}` : 顯示數字(g.成績);
    if (g.狀態 === "讀不懂") 成績.title = g.成績原文;
    li.append(名次, 誰, 成績);
    列表.appendChild(li);
  }

  // 山上的隊伍
  const 現在 = performance.now();
  const 還在 = new Set(榜.組.map((g) => g.組別));
  for (const [組別, 隊] of 隊伍) if (!還在.has(組別)) { 隊.根.remove(); 隊伍.delete(組別); }

  for (const g of 榜.組) 換組員(隊伍.get(g.組別) || 造隊伍(g), g.組員);

  // 營地：一排排開，放不下就整排縮小
  const 營地隊 = 榜.組.filter((g) => g.名次 === null).map((g) => 隊伍.get(g.組別));
  const 營地寬 = 營地隊.reduce((和, 隊) => 和 + 隊寬(隊) + 隊距, -隊距);
  const 營地縮放 = Math.min(1, 營地可用寬 / Math.max(1, 營地寬));
  let 營地x = 營地左;
  for (const 隊 of 營地隊) {
    const 寬 = 隊寬(隊) * 營地縮放;
    隊.在營地 = true;
    隊.營地點 = { x: 營地x + 寬 / 2, y: 814 }; // 留位置給兩行名字，不要掉出畫面
    隊.縮放 = 營地縮放;
    隊.偏移 = 0;
    隊.偏移y = 0;
    營地x += 寬 + 隊距 * 營地縮放;
  }

  // 步道上
  const 上山隊 = [];
  for (const g of 榜.組.filter((g) => g.名次 !== null)) {
    const 隊 = 隊伍.get(g.組別);
    const s = g.高度 * 步道長;
    const 剛出發 = 隊.在營地;
    if (剛出發) { 隊.在營地 = false; 隊.現在s = 0; }
    if (剛出發 || Math.abs(s - 隊.目標s) > 0.5) {
      隊.起s = 隊.現在s; 隊.目標s = s; 隊.起時 = 現在;
    }
    上山隊.push({ 隊, 點: 步道.getPointAtLength(s) });
  }
  排開擠在一起的(上山隊);

  for (const g of 榜.組) {
    const 隊 = 隊伍.get(g.組別);
    隊.根.classList.toggle("第一", g.名次 === 1);
    隊.根.classList.toggle("讀不懂", g.狀態 === "讀不懂");
  }
  // 超車：上次排在我前面的組，這次排到我後面了
  if (!第一次) {
    for (const g of 榜.組) {
      if (g.名次 === null) continue;
      const 我前 = 上次名次.get(g.組別);
      if (我前 === undefined || 我前 === null) continue;
      const 超過了 = 榜.組.some((o) => {
        const 他前 = 上次名次.get(o.組別);
        return o !== g && o.名次 !== null && 他前 != null && 他前 < 我前 && o.名次 > g.名次;
      });
      if (超過了) 跳一下(隊伍.get(g.組別));
    }
  }
  上次名次.clear();
  for (const g of 榜.組) 上次名次.set(g.組別, g.名次);
  // 名次越前面的畫在越上層
  [...榜.組].reverse().forEach((g) => $("隊伍").appendChild(隊伍.get(g.組別).根));
  第一次 = false;
}

// 一組大約多寬：人和人隔 40，加上兩邊的名字
function 隊寬(隊) {
  return (隊.人數 - 1) * 40 + 56;
}

// 主峰在 (600,100)，山腳 y=760 時左右各寬 560
function 山半寬(y) {
  return Math.max(0, ((y - 100) / 660) * 560);
}

// 山在這個高度能站人的半寬：留一點邊，腳才不會踩到山外面
function 可站半寬(y) {
  return 山半寬(y) * 可站比例;
}

// 寬度 寬 的一排，最高能排到哪個 y（山頂太窄，放不下就要往下）
function 放得下的y(寬) {
  return 100 + (寬 / 2 / (560 * 可站比例)) * 660;
}

// 步道一路往上，高度接近就是 y 接近。從山頂往下一排一排排：和這排 y 相差不到 一排高、
// 而且山在這個高度還站得下的組排進同一排；站不下就往下開新的一排。
// 這樣同分的組擠在山頂時會往下排，不會排到山外面的天空。排到山腳還放不下才縮小。
function 排開擠在一起的(上山隊) {
  上山隊.sort((a, b) => a.點.y - b.點.y);
  const 排們 = [];
  for (const 一個 of 上山隊) {
    const 寬 = 隊寬(一個.隊);
    const 上一排 = 排們[排們.length - 1];
    if (上一排 && 一個.點.y - 上一排.y < 一排高 && 上一排.寬 + 隊距 + 寬 <= 2 * 可站半寬(上一排.y)) {
      上一排.組.push(一個);
      上一排.寬 += 隊距 + 寬;
      continue;
    }
    const y = Math.min(最低排y, Math.max(一個.點.y, 放得下的y(寬), 上一排 ? 上一排.y + 一排高 : -Infinity));
    排們.push({ y, 寬, 組: [一個] });
  }
  for (const 排 of 排們) {
    排.組.sort((a, b) => a.點.x - b.點.x);
    const 半寬 = 可站半寬(排.y);
    const 縮放 = Math.max(最小縮放, Math.min(1, (半寬 * 2) / 排.寬));
    const 實寬 = 排.寬 * 縮放;
    // 中心盡量對著原本的位置，但整排不要跑出山外
    let 中心 = 排.組.reduce((和, { 點 }) => 和 + 點.x, 0) / 排.組.length;
    const 左界 = 山中心x - 半寬 + 實寬 / 2, 右界 = 山中心x + 半寬 - 實寬 / 2;
    中心 = 左界 <= 右界 ? Math.min(右界, Math.max(左界, 中心)) : 山中心x;
    let x = 中心 - 實寬 / 2;
    for (const { 隊, 點 } of 排.組) {
      const 這寬 = 隊寬(隊) * 縮放;
      隊.偏移 = x + 這寬 / 2 - 點.x;
      隊.偏移y = 排.y - 點.y;
      隊.縮放 = 縮放;
      x += 這寬 + 隊距 * 縮放;
    }
  }
}

function 跳一下(隊) {
  隊.根.classList.remove("跳");
  void 隊.根.getBBox();
  隊.根.classList.add("跳");
  clearTimeout(隊.跳計時);
  隊.跳計時 = setTimeout(() => 隊.根.classList.remove("跳"), 3000);
}

function 顯示數字(x) {
  const 絕對 = Math.abs(x);
  if (絕對 !== 0 && (絕對 >= 1e6 || 絕對 < 1e-3)) return x.toExponential(2);
  return Number(x.toPrecision(5)).toLocaleString("zh-TW", { maximumFractionDigits: 4 });
}

// 沿著步道走：每一格畫面把各隊往目標推一點
function 動畫(現在) {
  for (const 隊 of 隊伍.values()) {
    let 目標;
    if (隊.在營地) {
      目標 = { ...隊.營地點, k: 隊.縮放 };
    } else {
      const t = Math.min(1, (現在 - 隊.起時) / 走路毫秒);
      const 緩 = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
      隊.現在s = 隊.起s + (隊.目標s - 隊.起s) * 緩;
      const 點 = 步道.getPointAtLength(隊.現在s);
      目標 = { x: 點.x + 隊.偏移, y: 點.y + 隊.偏移y, k: 隊.縮放 };
    }
    // 不直接跳到目標，每格靠近一點：換位置、縮放、回營地都會滑過去
    const 舊 = 隊.顯示 || 目標;
    const 新 = {
      x: 舊.x + (目標.x - 舊.x) * 靠近比例,
      y: 舊.y + (目標.y - 舊.y) * 靠近比例,
      k: 舊.k + (目標.k - 舊.k) * 靠近比例,
    };
    if (Math.abs(新.x - 舊.x) > 0.3) 隊.面向 = 新.x > 舊.x ? 1 : -1;
    隊.顯示 = 新;
    const 走 = Math.hypot(目標.x - 新.x, 目標.y - 新.y) > 2 || Math.hypot(新.x - 舊.x, 新.y - 舊.y) > 0.5;
    隊.根.classList.toggle("走", 走);
    隊.根.setAttribute("transform", `translate(${新.x.toFixed(1)} ${新.y.toFixed(1)}) scale(${新.k.toFixed(3)})`);
    隊.根.classList.toggle("朝左", 隊.面向 < 0);
  }
  requestAnimationFrame(動畫);
}

// ---------- 立體（three.js） ----------
// 位置還是原本的程式算（隊.顯示、偏移、縮放、面向），名字、問號、超車也還是 SVG 疊在最上面，所以字清楚、
// 排開名字的算法不用重寫。three.js 畫山、步道、小人、旗子、皇冠和背景。

const 斜角 = (7 * Math.PI) / 180; // 從稍微高一點的地方往下看，地面才看得出深度
const 風格光 = {
  白天: { 雪: 1, 環境: 1.0, 日: 2.6, 補: 0.45, 星: 0, 火: 0.3 },
  夜晚: { 雪: 1, 環境: 0.6, 日: 0.9, 補: 1.3, 星: 1, 火: 1 },
  日出: { 雪: 0, 環境: 0.9, 日: 2.8, 補: 0.45, 星: 0, 火: 0.5 },
};
let 立體承諾 = null;

const 量色筆 = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
function 讀色(THREE, 名) {
  量色筆.clearRect(0, 0, 1, 1);
  量色筆.fillStyle = getComputedStyle(document.documentElement).getPropertyValue(名).trim();
  量色筆.fillRect(0, 0, 1, 1);
  const [r, g, b] = 量色筆.getImageData(0, 0, 1, 1).data;
  return new THREE.Color().setRGB(r / 255, g / 255, b / 255, THREE.SRGBColorSpace);
}
function 種子亂數(種子) {
  return () => {
    種子 = (種子 + 0x6d2b79f5) | 0;
    let t = Math.imul(種子 ^ (種子 >>> 15), 1 | 種子);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 柏林雜訊（Ken Perlin 改良版），用來做山的稜線、溝和雪線
function 柏林(種子) {
  const 亂 = 種子亂數(種子), 表 = [...Array(256).keys()], p = new Uint8Array(512);
  for (let i = 255; i > 0; i--) { const j = Math.floor(亂() * (i + 1)); [表[i], 表[j]] = [表[j], 表[i]]; }
  for (let i = 0; i < 512; i++) p[i] = 表[i & 255];
  const 緩 = (t) => t * t * t * (t * (t * 6 - 15) + 10), 插 = (a, b, t) => a + t * (b - a);
  const 梯 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return (h & 1 ? -u : u) + (h & 2 ? -v : v); };
  function 噪(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = 緩(x), v = 緩(y), w = 緩(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return 插(插(插(梯(p[AA], x, y, z), 梯(p[BA], x - 1, y, z), u), 插(梯(p[AB], x, y - 1, z), 梯(p[BB], x - 1, y - 1, z), u), v),
      插(插(梯(p[AA + 1], x, y, z - 1), 梯(p[BA + 1], x - 1, y, z - 1), u), 插(梯(p[AB + 1], x, y - 1, z - 1), 梯(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
  }
  return {
    fbm(x, y, z, 層) {
      let 和 = 0, 幅 = 0.5, 頻 = 1;
      for (let i = 0; i < 層; i++) { 和 += 幅 * 噪(x * 頻, y * 頻, z * 頻); 幅 *= 0.5; 頻 *= 2.03; }
      return 和;
    },
  };
}

async function 準備立體() {

  畫布.setAttribute("aria-hidden", "true");
  const 畫家 = new THREE.WebGLRenderer({ canvas: 畫布, antialias: true, alpha: true }); // 沒有 WebGL 會在這裡丟錯
  畫家.setPixelRatio(Math.min(2, devicePixelRatio));

  區.prepend(畫布);

  const 場景 = new THREE.Scene();
  const 相機 = new THREE.OrthographicCamera(0, 1200, 0, -860, 1, 9000);
  相機.position.set(0, 0, 4500);
  // 世界的原點放在山腳中心 (600, 760)
  const 世界 = new THREE.Group();
  世界.position.set(600, -760, 0);
  世界.rotation.x = 斜角;
  場景.add(世界);

  // 換風格時只換顏色：每個材質記住自己用哪個顏色 token
  const 染過 = [];
  const 染 = (材質, 名) => { 染過.push([材質, 名]); return 材質; };
  const 實 = (名, 選項 = {}) => 染(new THREE.MeshStandardMaterial({ roughness: 0.85, ...選項 }), 名);
  const 稜 = (名, 選項 = {}) => 實(名, { flatShading: true, ...選項 });
  const 亮 = (名, 選項 = {}) => 染(new THREE.MeshBasicMaterial(選項), 名);
  const 放 = (幾何, 材質, 父, x = 0, y = 0, z = 0) => {
    const o = new THREE.Mesh(幾何, 材質);
    o.position.set(x, y, z);
    父.add(o);
    return o;
  };
  const 組 = (父, x = 0, y = 0, z = 0) => {
    const o = new THREE.Group();
    o.position.set(x, y, z);
    父.add(o);
    return o;
  };
  const 投影 = (o) => { o.castShadow = true; o.receiveShadow = true; return o; };
  // 雪花和星星用一張圓形漸層圖，不然點是方的

    const c = document.createElement("canvas");

    漸.addColorStop(0, "#fff"); 漸.addColorStop(0.5, "rgba(255,255,255,0.8)"); 漸.addColorStop(1, "rgba(255,255,255,0)");

  const 山們 = [];
  function 造山(父, 半徑, 高, 圈數, 層數, 種子, 雪線, 色名) {
    const 雜 = 柏林(種子);
    const g = new THREE.ConeGeometry(半徑, 高, 圈數, 層數, true, Math.PI).translate(0, 高 / 2, 0);
    const p = g.attributes.position;
    const 岩紋 = new Float32Array(p.count), 雪量 = new Float32Array(p.count);
    for (let i = 0; i < p.count; i++) {

      const 稜 = 1 - Math.abs(雜.fbm(Math.cos(a) * 2.4, h * 1.3, Math.sin(a) * 2.4, 4)); // 上下拉長的稜線和溝
      const 細 = 雜.fbm((x / 半徑) * 7, h * 9, (z / 半徑) * 7, 5);

    筆.fillStyle = t3.色字;
    筆.fillRect(0, 0, 136, 88);
    筆.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--d-flag-ink").trim();
    筆.font = "800 68px 'Barlow Condensed', 'Noto Sans TC', sans-serif";
    筆.textAlign = "center"; 筆.textBaseline = "middle";
    筆.fillText(t3.組別, 68, 48);
    t3.旗圖.needsUpdate = true;
  }
  function 造立體隊(組別, 隊) {
    const 根 = 組(場景);
    根.rotation.x = 斜角;
    const 衣 = new THREE.MeshStandardMaterial({ color: new THREE.Color(隊.色), roughness: 0.62 });
    const 衣暗 = new THREE.MeshStandardMaterial({ color: new THREE.Color(隊.色).multiplyScalar(0.6), roughness: 0.75 });
    const 人群 = 組(根);
    const 旗 = 組(根);
    放(new THREE.CylinderGeometry(1.3, 1.3, 90, 8).translate(0, 45, 0), 材.旗桿, 旗, 0, 0, -4);
    放(new THREE.SphereGeometry(2.4, 10, 8), 材.皇冠, 旗, 0, 91, -4);
    const 旗字布 = document.createElement("canvas");
    旗字布.width = 136; 旗字布.height = 88;
    const 旗圖 = new THREE.CanvasTexture(旗字布);
    旗圖.colorSpace = THREE.SRGBColorSpace;
    旗圖.anisotropy = 4;
    const 布 = new THREE.PlaneGeometry(34, 22, 12, 5).translate(17, 77, 0);
    放(布, new THREE.MeshStandardMaterial({ map: 旗圖, side: THREE.DoubleSide, roughness: 0.8 }), 旗, 0, 0, -4);
    const 皇冠 = 組(旗, 17, 96, -4);
    放(new THREE.CylinderGeometry(9, 9, 6, 20, 1, true), 實("--crown", { metalness: 0.55, roughness: 0.3, side: THREE.DoubleSide }), 皇冠);
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      放(new THREE.ConeGeometry(2.6, 8, 6), 材.皇冠, 皇冠, Math.cos(a) * 8.4, 6.5, Math.sin(a) * 8.4);
      放(new THREE.SphereGeometry(1.4, 8, 6), 材.皇冠, 皇冠, Math.cos(a) * 8.4, 11, Math.sin(a) * 8.4);
      放(new THREE.OctahedronGeometry(1.5, 0), 材.寶石, 皇冠, Math.cos(a + 0.63) * 9.2, 0, Math.sin(a + 0.63) * 9.2);
    }
    const t3 = { 根, 衣, 衣暗, 人群, 旗, 布, 布原: 布.attributes.position.array.slice(), 皇冠, 旗字布, 旗圖, 組別, 色字: 隊.色, 人們: [], 名單: null, 繩: null, 跳起: 0 };
    寫旗(t3);
    隊3D.set(隊, t3);
    return t3;
  }
  function 換人(t3, 隊) {
    t3.名單 = 隊.名單;
    t3.人群.clear();
    if (t3.繩) t3.繩.geometry.dispose();
    const n = 隊.人數, 起 = -((n - 1) * 40) / 2;
    t3.人們 = Array.from({ length: n }, (_, i) => 造人(t3.人群, 起 + i * 40, t3.衣, t3.衣暗, i * 1.7));
    if (n > 1) {
      const 點 = [];
      for (let i = 0; i < n; i++) {
        點.push(new THREE.Vector3(起 + i * 40, 26, -2));
        if (i < n - 1) 點.push(new THREE.Vector3(起 + i * 40 + 20, 18, 1));
      }
      t3.繩 = 放(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(點), n * 16, 0.9, 6), 材.繩, t3.人群);
    }
    t3.旗.position.x = 起 - 6;
  }
  function 拆隊(隊, t3) {
    t3.根.removeFromParent();
    t3.旗圖.dispose();
    隊3D.delete(隊);
  }

  const 近 = (a, b, k) => a + (b - a) * k;
  function 動小人(t3, 隊, 秒, 差, 靜) {
    const 走 = 隊.根.classList.contains("走");
    const k = Math.min(1, 差 * 8);
    for (const 人 of t3.人們) {
      人.走 = 近(人.走, 走 && !靜 ? 1 : 0, k);
      人.轉 = 近(人.轉, 隊.面向 * (走 ? 1.05 : 0.32), Math.min(1, 差 * 6));
      const w = 人.走, p = 秒 * 9 + 人.相位, s = Math.sin(p);
      人.根.rotation.y = 人.轉;
      人.身體.position.y = w * Math.abs(Math.cos(p)) * 1.6;
      人.上身.rotation.x = 0.03 + w * 0.13;
      人.上身.scale.y = 1 + (1 - w) * 0.012 * Math.sin(秒 * 2 + 人.相位);
      const 看 = 靜 ? 0 : (1 - w) * 0.28 * Math.sin(秒 * 0.6 + 人.相位 * 2);
      人.頭.rotation.y = -人.轉 * 0.45 + 看;
      人.頭.rotation.x = -0.06 - w * 0.08;
      人.腿們.forEach(({ 腿, 膝 }, i) => {
        const 擺 = (i ? -s : s) * 0.6 * w;
        腿.rotation.x = -擺;
        膝.rotation.x = 0.06 + w * 0.8 * Math.max(0, i ? s : -s);
      });
      人.手們.forEach(({ 肩, 肘 }, i) => {
        肩.rotation.x = (i ? s : -s) * 0.55 * w - 0.08;
        肘.rotation.x = -0.35 - w * 0.25;
      });
    }
  }
  function 飄(幾何, 原, 秒, 長, 幅, 相位) {
    const p = 幾何.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = 原[i * 3], u = x / 長;
      p.setZ(i, 原[i * 3 + 2] + Math.sin(x * 0.22 - 秒 * 5 + 相位) * u * 幅);
      p.setY(i, 原[i * 3 + 1] + Math.sin(x * 0.15 - 秒 * 3.4 + 相位) * u * 幅 * 0.35);
    }
    p.needsUpdate = true;
    幾何.computeVertexNormals();
  }

  function 跟上隊伍(現在, 秒, 差, 靜) {
    const 還在 = new Set(隊伍.values());
    for (const [隊, t3] of 隊3D) if (!還在.has(隊)) 拆隊(隊, t3);
    const 順序 = [...$("隊伍").children];
    for (const [組別, 隊] of 隊伍) {
      const t3 = 隊3D.get(隊) || 造立體隊(組別, 隊);
      if (t3.名單 !== 隊.名單) 換人(t3, 隊);
      const 顯 = 隊.顯示;
      t3.根.visible = !!顯;
      if (!顯) continue;
      // 和 SVG 的「跳」一樣：0.5 秒跳一次，跳三次
      const 跳 = 隊.根.classList.contains("跳");
      if (跳 && !t3.跳起) t3.跳起 = 現在;
      if (!跳) t3.跳起 = 0;
      let 抬 = 0;
      if (t3.跳起 && !靜) {
        const e = (現在 - t3.跳起) / 500;
        if (e < 3) { const f = e % 1; 抬 = 22 * (f < 0.4 ? 1 - (1 - f / 0.4) ** 2 : 1 - ((f - 0.4) / 0.6) ** 2); }
      }
      t3.根.position.set(顯.x, -顯.y + 抬, 1200 + 順序.indexOf(隊.根) * 60);
      t3.根.scale.setScalar(顯.k);
      t3.皇冠.visible = 隊.根.classList.contains("第一");
      t3.皇冠.rotation.y = 秒 * 1.2;
      t3.皇冠.position.y = 96 + Math.sin(秒 * 2.4) * 1.5;
      if (!靜) 飄(t3.布, t3.布原, 秒, 34, 3.2, t3.人們.length);
      動小人(t3, 隊, 秒, 差, 靜);
    }
  }

  // 讓相機的範圍和 SVG 的 viewBox（xMidYMax meet）對齊
  function 對齊() {
    const 框 = 區.getBoundingClientRect(), 圖 = $("山").getBoundingClientRect();
    畫家.setSize(框.width, 框.height, false);
    const s = Math.min(圖.width / 1200, 圖.height / 860);
    const x0 = 圖.left - 框.left + (圖.width - 1200 * s) / 2;
    const y0 = 圖.top - 框.top + 圖.height - 860 * s;
    相機.left = -x0 / s;
    相機.right = (框.width - x0) / s;
    相機.top = y0 / s;
    相機.bottom = -(框.height - y0) / s;
    相機.updateProjectionMatrix();
  }

  let 光 = 風格光.白天;
  function 上色() {
    for (const [材質, 名] of 染過) 材質.color.copy(色(名));
    山上色();
    光 = 風格光[document.documentElement.dataset.theme] || 風格光.白天;
    天光.color.copy(色("--d-hemi-sky"));
    天光.groundColor.copy(色("--d-hemi-ground"));
    天光.intensity = 光.環境;
    日光.color.copy(色("--d-sunlight"));
    日光.intensity = 光.日;
    補光.intensity = 光.補;
    火光.color.copy(色("--d-fire"));
    星材.opacity = 光.星;
    for (const 層 of 雪層們) 層.片.visible = !!光.雪; // 日出是晴天，不下雪
    for (const t3 of 隊3D.values()) 寫旗(t3);
    牌.寫();
  }

  const 不動 = matchMedia("(prefers-reduced-motion: reduce)");
  let 上一格 = performance.now() / 1000;
  function 畫一格(現在) {
    const 秒 = 現在 / 1000, 差 = Math.min(0.05, Math.max(0, 秒 - 上一格)), 靜 = 不動.matches;
    上一格 = 秒;
    if (!靜) {
      日光.position.set(500 + 320 * Math.sin(秒 * 0.1), 900, 520); // 太陽慢慢移，山的明暗跟著變
      for (const [i, 朵] of 雲們.entries()) {
        朵.position.x += 差 * (9 + i * 4);
        if (朵.position.x > 相機.right + 220) 朵.position.x = 相機.left - 220;
      }
      for (const 層 of 雪層們) {
        for (let i = 0; i < 層.數; i++) {
          const j = i * 3;
          層.點[j] += Math.sin(秒 + i) * 9 * 差 * 層.快;
          層.點[j + 1] -= (26 + (i % 7) * 7) * 差 * 層.快;
          if (層.點[j + 1] < 相機.bottom) { 層.點[j + 1] = 相機.top; 層.點[j] = 隨(相機.left, 相機.right); }
        }
        層.幾何.attributes.position.needsUpdate = true;
      }
      飄(頂布, 頂布原, 秒, 46, 4, 0);
      火焰.forEach((f, i) => f.scale.set(1, 0.8 + 0.3 * Math.abs(Math.sin(秒 * (9 + i * 3) + i)), 1));
      for (const [i, 圈] of 光圈們.entries()) 圈.scale.setScalar(1 + 0.04 * Math.sin(秒 * 1.3 + i));
    } else {
      日光.position.set(500, 900, 520);
    }
    火光.intensity = 光.火 * 2.2 * (靜 ? 1 : 0.85 + 0.15 * Math.sin(秒 * 13));
    跟上隊伍(現在, 秒, 差, 靜);
    畫家.render(場景, 相機);
    requestAnimationFrame(畫一格);
  }
  new ResizeObserver(對齊).observe(區);
  document.fonts?.ready.then(() => { for (const t3 of 隊3D.values()) 寫旗(t3); 牌.寫(); });

  document.documentElement.classList.add("有3D");
  對齊();
  撒();
  上色();
  requestAnimationFrame(畫一格);
  return { 上色 };
}

function 開立體() {
  立體承諾 = 立體承諾 || 準備立體().catch((錯) => {
    console.warn("3D 開不起來，先畫平面的山", 錯);
    return null;
  });
  return 立體承諾;
}

function 換風格() {
  document.documentElement.dataset.theme = 設定.風格;
  開立體().then((立體) => 立體?.上色());
}

換風格();
寫名稱();
requestAnimationFrame(動畫);
if (設定.連結) 讀一次(); else 開設定();
setInterval(讀一次, 刷新秒數 * 1000);
</script>
</body>
